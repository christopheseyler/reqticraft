[package]
name = "rc-convert"
description = "Convertisseurs : document natif vers fichier intermédiaire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
calamine = "0.35.0"
csv = "1.4.0"
lopdf = "0.42.0"
pdf-extract = "0.12.1"
rc-interop = { version = "0.1.0", path = "../rc-interop" }
roxmltree = "0.21.2"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
